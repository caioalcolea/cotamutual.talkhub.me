version: "3.7"

# =============================================================================
# Stack: mcpcotacaomutual
# Servidor MCP (Mutual API v2) publicado em https://mcpcotacaomutual.talkhub.me
#
# Padrao do servidor:
#   - rede overlay externa "talkhub"
#   - Traefik v3 (entrypoint websecure + certresolver letsencryptresolver)
#   - imagem buildada localmente (mcpcotacaomutual:latest), igual aos demais MCPs
#
# Os valores ${...} sao substituidos a partir do .env no momento do deploy:
#   set -a; source .env; set +a; docker stack deploy -c docker-compose.yml mcpcotacaomutual
# =============================================================================

services:

## --------------------------- mcpcotacaomutual --------------------------- ##

  mcpcotacaomutual:
    image: mcpcotacaomutual:latest

    networks:
      - talkhub

    environment:
      - TRANSPORT=http
      - PORT=3000
      - MUTUAL_PROD_BASE_URL=https://apis.mutual.app.br
      - MUTUAL_HML_BASE_URL=https://apis-hml.mutual.app.br
      - MUTUAL_CRYPTO_ENV=${MUTUAL_CRYPTO_ENV:-hml}
      - MUTUAL_API_KEY=${MUTUAL_API_KEY}
      - MUTUAL_SERVICE_TOKEN=${MUTUAL_SERVICE_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - TZ=America/Sao_Paulo

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.docker.network=talkhub
        # Router HTTPS
        - traefik.http.routers.mcpcotacaomutual.rule=Host(`mcpcotacaomutual.talkhub.me`)
        - traefik.http.routers.mcpcotacaomutual.entrypoints=websecure
        - traefik.http.routers.mcpcotacaomutual.tls=true
        - traefik.http.routers.mcpcotacaomutual.tls.certresolver=letsencryptresolver
        - traefik.http.routers.mcpcotacaomutual.service=mcpcotacaomutual
        # Service (porta interna do container)
        - traefik.http.services.mcpcotacaomutual.loadbalancer.server.port=3000
        - traefik.http.services.mcpcotacaomutual.loadbalancer.passHostHeader=true

## --------------------------- mcpcotacaomutual --------------------------- ##

networks:
  talkhub:
    external: true
    name: talkhub
