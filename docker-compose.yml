version: "3.7"

# =============================================================================
# Stack: cotamutual
# Bot de cotacoes por grupo + painel publicado em https://cotamutual.talkhub.me
#
# Padrao do servidor:
#   - rede overlay externa "talkhub"
#   - Traefik v3 (entrypoint websecure + certresolver letsencryptresolver)
#   - imagem buildada localmente (cotamutual:latest)
#
# Deploy:
#   set -a; source .env; set +a
#   docker stack deploy -c docker-compose.yml cotamutual
# =============================================================================

services:

  cotamutual:
    image: cotamutual:latest

    networks:
      - talkhub

    environment:
      - PORT=3000
      - MUTUAL_PROD_BASE_URL=https://apis.mutual.app.br
      - MUTUAL_HML_BASE_URL=https://apis-hml.mutual.app.br
      - MUTUAL_CRYPTO_ENV=${MUTUAL_CRYPTO_ENV:-hml}
      - MUTUAL_API_KEY=${MUTUAL_API_KEY}
      - MUTUAL_SERVICE_TOKEN=${MUTUAL_SERVICE_TOKEN}
      # Fase atual: NUNCA habilitar ordens sem alinhamento com a Mutual.
      - ORDERS_ENABLED=${ORDERS_ENABLED:-false}
      - QUOTE_QUEUE_MESSAGES=${QUOTE_QUEUE_MESSAGES:-10}
      - QUOTE_QUEUE_INTERVAL_MS=${QUOTE_QUEUE_INTERVAL_MS:-3000}
      - QUOTE_REFERENCE_BRL_AMOUNT=${QUOTE_REFERENCE_BRL_AMOUNT:-1000}
      - DATA_DIR=/app/data
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
      - PANEL_TOKEN=${PANEL_TOKEN}
      - OUTBOUND_MODE=${OUTBOUND_MODE:-webhook}
      - OUTBOUND_WEBHOOK_URL=${OUTBOUND_WEBHOOK_URL}
      - OUTBOUND_TOKEN=${OUTBOUND_TOKEN}
      - TZ=America/Sao_Paulo

    volumes:
      - cotamutual_data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.docker.network=talkhub
        - traefik.http.routers.cotamutual.rule=Host(`cotamutual.talkhub.me`)
        - traefik.http.routers.cotamutual.entrypoints=websecure
        - traefik.http.routers.cotamutual.tls=true
        - traefik.http.routers.cotamutual.tls.certresolver=letsencryptresolver
        - traefik.http.routers.cotamutual.service=cotamutual
        - traefik.http.services.cotamutual.loadbalancer.server.port=3000
        - traefik.http.services.cotamutual.loadbalancer.passHostHeader=true

networks:
  talkhub:
    external: true
    name: talkhub

volumes:
  cotamutual_data:
