version: "3.7"
services:

## --------------------------- COTACAO MUTUAL --------------------------- ##

  cotacaomutual:
    image: cotacaomutual:latest ## Build local: docker build -t cotacaomutual:latest .

    volumes:
      - cotacaomutual_data:/app/data

    networks:
      - talkhub ## Nome da rede interna

    environment:
      - PORT=3000

    ## 🔑 Mutual API v2
      - MUTUAL_PROD_BASE_URL=https://apis.mutual.app.br
      - MUTUAL_HML_BASE_URL=https://apis-hml.mutual.app.br
      - MUTUAL_CRYPTO_ENV=${MUTUAL_CRYPTO_ENV:-prod}
      - MUTUAL_API_KEY=${MUTUAL_API_KEY}
      - MUTUAL_SERVICE_TOKEN=${MUTUAL_SERVICE_TOKEN}

    ## 🚫 Fase atual: ordens SEMPRE desabilitadas (somente cotações)
      - ORDERS_ENABLED=${ORDERS_ENABLED:-false}

    ## 📊 Fila de cotações (10 msgs, requisições separadas)
      - QUOTE_QUEUE_MESSAGES=${QUOTE_QUEUE_MESSAGES:-10}
      - QUOTE_QUEUE_INTERVAL_MS=${QUOTE_QUEUE_INTERVAL_MS:-3000}
      - QUOTE_REFERENCE_BRL_AMOUNT=${QUOTE_REFERENCE_BRL_AMOUNT:-1000}

    ## 💾 Persistência (toggles do painel + registro de cotações)
      - DATA_DIR=/app/data

    ## 🔐 Proteção dos endpoints
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
      - PANEL_TOKEN=${PANEL_TOKEN}

    ## 📱 Evolution API v2 (envio das mensagens ao grupo)
      - OUTBOUND_MODE=${OUTBOUND_MODE:-evolution}
      - EVOLUTION_BASE_URL=${EVOLUTION_BASE_URL:-https://whatsapp.talkhub.me}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-talkbia}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}

    ## 🌎 Timezone
      - TZ=America/Sao_Paulo

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.cotacaomutual.rule=Host(`cotacaomutual.talkhub.me`) ## Url do serviço
        - traefik.http.routers.cotacaomutual.entrypoints=websecure
        - traefik.http.routers.cotacaomutual.tls.certresolver=letsencryptresolver
        - traefik.http.services.cotacaomutual.loadbalancer.server.port=3000
        - traefik.http.services.cotacaomutual.loadbalancer.passHostHeader=true
        - traefik.http.routers.cotacaomutual.service=cotacaomutual

## --------------------------- COTACAO MUTUAL --------------------------- ##

volumes:
  cotacaomutual_data:
    external: true
    name: cotacaomutual_data

networks:
  talkhub: ## Nome da rede interna
    external: true
    name: talkhub ## Nome da rede interna
